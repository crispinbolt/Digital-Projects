<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posh Virtual Receptionists | ICAEW Benefits+ banner ad (white)</title>
  <link rel="stylesheet" href="../css/banner-ad.css">
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>

  <!--
    Standalone copy of the ICAEW Benefits+ partner banner (white variant),
    used for preview and for exporting a static image (see export.js). The
    same markup is embedded in ../index.html; keep the two in sync.
  -->
  <aside class="ad" id="icaew-banner" aria-label="Posh Virtual Receptionists offer for ICAEW members">
    <div class="ad__card">
      <div class="ad__brand">
        <img class="ad__brand-logo" src="../images/posh-logo.png" alt="POSH">
        <p class="ad__brand-line">Virtual Receptionists</p>
      </div>
      <div class="ad__partner-tile">
        <img class="ad__partner" src="../images/icaew-benefits-partner.png" alt="ICAEW Benefits+ Partner">
      </div>
      <div class="ad__copy">
        <div class="ad__text">
          <p class="ad__headline">Do you capture every call?</p>
          <p class="ad__offer">7-day free trial, then 20% off</p>
        </div>
        <a class="ad__cta" href="../index.html#contact">Find out more</a>
      </div>
      <div class="ad__photo" role="img" aria-label="Smiling businesswoman taking a call on her mobile phone"></div>
    </div>
  </aside>

</body>
</html>
